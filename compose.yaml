services:
  api:
    image: ghcr.io/qazwsd741856-hue/backend-portfolio-api:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: backend-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging: 
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "256m"
  web:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/certbot/www
    depends_on:
      api:
        condition: service_healthy
    logging: 
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "64m"
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD","pg_isready","-U","${POSTGRES_USER}","-d","${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: 
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "256m"
    restart: unless-stopped
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes    
    logging: 
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"  
    mem_limit: "128m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    image: ghcr.io/qazwsd741856-hue/backend-portfolio-api:${IMAGE_TAG:?IMAGE_TAG is required}
    command: celery -A celery_app:celery_app worker -Q notifications --loglevel=info --concurrency=1 
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: unless-stopped
  publisher:
    image: ghcr.io/qazwsd741856-hue/backend-portfolio-api:${IMAGE_TAG:?IMAGE_TAG is required}
    command: python outbox_publisher.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: unless-stopped  
  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
  node-exporter:
    image: prom/node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command: 
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/lib/docker:/var/lib/docker:ro
  grafana:
    image: grafana/grafana
    volumes:
      - grafana_data:/var/lib/grafana
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: