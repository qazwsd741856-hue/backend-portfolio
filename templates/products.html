<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <main class="page-container">
        <h1>Products</h1>
        <p>Product and stock management demo</p>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                    </tr>
                </thead>

                <tbody id="product-table-body">
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <button id="previous-page" disabled>Previous</button>
            <span id="page-number">Page 1</span>
            <button id="next-page" disabled>Next</button>
        </div>
        <p id="products-message"></p>
        <h2>Create order</h2>

        <form id="order-form">
            <div class="form-group">
                <label>Product ID</label>
                <input name="product_id">
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input name="amount">
            </div>

            <button type="submit">Create Order</button>
        </form>

        <p id="order-message"></p>
        <section id="event-section" hidden>
            <h2>Order Event Status</h2>
            <div class="event-details">
                <p>Order ID: <span id="event-order-id"">-</span></p>
                <p>Event ID: <span id="event-id">-</span></p>
            </div>
            <p id="event-message"></p>
        </section>

        <a href="/">Back to Dashboard</a>
    </main>
    <script src="/static/js/products.js"></script>
</body>
</html>
