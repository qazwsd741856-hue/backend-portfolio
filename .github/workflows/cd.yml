name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s %s\n' "$SERVER_HOST" "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "
            DEPLOY_SHA='$DEPLOY_SHA'
            IMAGE_TAG="\$DEPLOY_SHA"

            cd ~/backend-portfolio || exit 1

            DISK_USAGE=\$(df -P / | awk 'NR==2 {print \$5}' | tr -d '%')
            echo "Disk usage: \${DISK_USAGE}%"
            if [ "\$DISK_USAGE" -ge 85 ]; then
              echo "Disk usage is high, cleaning old build cache"
              sudo docker builder prune -f --filter "until=24h"
              
              DISK_USAGE=\$(df -P / | awk 'NR==2 {print \$5}' | tr -d '%')

              if [ "\$DISK_USAGE" -ge 85 ]; then
                echo "Disk usage is still too high: \${DISK_USAGE}%"
                exit 1
              fi
            fi
            
            if sudo docker inspect backend-api --format "{{.Config.Image}}" > /dev/null 2>&1; then
              CURRENT_IMAGE=\$(sudo docker inspect backend-api --format "{{.Config.Image}}")
              CURRENT_TAG="\${CURRENT_IMAGE##*:}"
              CAN_ROLLBACK=true

              echo "CURRENT_IMAGE:\${CURRENT_IMAGE}"
            else
              CAN_ROLLBACK=false

              echo "No existing API container, rollback will not be available"
            fi

            git fetch origin || exit 1
            git reset --hard "\$DEPLOY_SHA" || exit 1
            sudo IMAGE_TAG="\$IMAGE_TAG" docker compose build api || exit 1
            sudo IMAGE_TAG="\$IMAGE_TAG" docker compose run --rm api alembic upgrade head || exit 1
            sudo IMAGE_TAG="\$IMAGE_TAG" docker compose up -d api || exit 1
            
            DEPLOY_SUCCESS=false
            for i in {1..12}; do
              status=\$(sudo docker inspect --format="{{.State.Health.Status}}" backend-api)

              echo "API health status: \$status"

              if [ "\$status" = "healthy" ]; then
                DEPLOY_SUCCESS=true
                break
              fi

              sleep 5
            done

            if [ "\$DEPLOY_SUCCESS" = "true" ]; then
              echo "Deployment successful"
              
              DEPLOY_IMAGE="backend-portfolio-api:\$DEPLOY_SHA"

              for image in \$(sudo docker image ls "backend-portfolio-api:*" --format "{{.Repository}}:{{.Tag}}"); do
                if [ "\$image" = "\$DEPLOY_IMAGE" ] || [ "\$image" = "\$CURRENT_IMAGE" ]; then
                  echo "keep:\$image"
                else
                  sudo docker image rm "\$image"
                  echo "delete:\$image"
                fi
              done
              
              exit 0
            else 
              echo "Deployment failed , starting rollback"
            fi

            if [ "\$CAN_ROLLBACK" = "false" ]; then
              echo "Cannot rollback,no useful image"
              exit 1
            else 
              echo "Rollback processing"
              sudo IMAGE_TAG="\$CURRENT_TAG" docker compose up -d api || exit 1
            fi
            
            ROLLBACK_SUCCESS=false
            for i in {1..12}; do 
              status=\$(sudo docker inspect backend-api --format "{{.State.Health.Status}}")

              if [ "\$status" = "healthy" ]; then
                ROLLBACK_SUCCESS=true
                break
              fi

              sleep 5
            done

            if [ "\$ROLLBACK_SUCCESS" = "true" ]; then
              echo "Rollback successful"
              exit 1
            else
              echo "Rollback failed"
              exit 1  
            fi  
            "
