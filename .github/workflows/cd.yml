name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s %s\n' "$SERVER_HOST" "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "
            DEPLOY_SHA='$DEPLOY_SHA'
            IMAGE_TAG="\$DEPLOY_SHA"

            cd ~/backend-portfolio &&
            git fetch origin &&
            git reset --hard "\$DEPLOY_SHA" &&
            sudo IMAGE_TAG="\$IMAGE_TAG" docker compose build api &&
            sudo IMAGE_TAG="\$IMAGE_TAG" docker compose run --rm api alembic upgrade head &&
            sudo IMAGE_TAG="\$IMAGE_TAG" docker compose up -d api &&

            for i in {1..12}; do
              status=\$(sudo docker inspect --format="{{.State.Health.Status}}" backend-api)

              echo "API health status: \$status"

              if [ "\$status" = "healthy" ]; then
                echo "API is healthy"
                exit 0
              fi

              sleep 5
            done

            echo "API did not become healthy in time"
            exit 1
          "
