name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with: 
          ref: ${{ env.DEPLOY_SHA }}
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Image
        run: |
          docker build -t "ghcr.io/qazwsd741856-hue/backend-portfolio-api:$DEPLOY_SHA" .
      - name: Push API Image
        run: |
          docker push "ghcr.io/qazwsd741856-hue/backend-portfolio-api:$DEPLOY_SHA" 
      
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s %s\n' "$SERVER_HOST" "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_USERNAME: qazwsd741856-hue
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "
            DEPLOY_SHA='$DEPLOY_SHA'
            APP_DOMAIN='$APP_DOMAIN'
            GHCR_USERNAME='$GHCR_USERNAME'
            GHCR_READ_TOKEN='$GHCR_READ_TOKEN'
            IMAGE_TAG="\$DEPLOY_SHA"

            check_production(){
              echo "Check API health"
              API_SUCCESS=false
              for i in {1..24}; do
                status=\$(sudo docker inspect --format="{{.State.Health.Status}}" backend-api)
      
                echo "API health status: \$status"

                if [ "\$status" = "healthy" ]; then
                  API_SUCCESS=true
                  break
                fi
                sleep 5
              done
              if [ "\$API_SUCCESS" != "true" ]; then
                echo "API health check failed"
                return 1
              fi

              WORKER_ID=\$(sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml ps -q worker)
              PUBLISHER_ID=\$(sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml ps -q publisher)
              
              if [ -z "\$WORKER_ID" ] || [ -z "\$PUBLISHER_ID" ];then
                echo "Worker or Publisher container not found"
                return 1
              fi              
              WORKER_RUNNING=\$(sudo docker inspect --format="{{.State.Running}}" "\$WORKER_ID")
              PUBLISHER_RUNNING=\$(sudo docker inspect --format="{{.State.Running}}" "\$PUBLISHER_ID")
                  
              echo "Worker running: \$WORKER_RUNNING"
              echo "Publisher running: \$PUBLISHER_RUNNING"
              if [ "\$WORKER_RUNNING" != "true" ] || [ "\$PUBLISHER_RUNNING" != "true" ]; then
                return 1 
              fi
              
              echo "Check Nginx config"
              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml exec -T web nginx -t;then
                echo "Nginx config check failed"
                return 1
              fi
              echo "Reloading Nginx"
              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml exec -T web nginx -s reload;then  
                echo "Nginx reload failed"
                return 1
              fi
              echo "Check HTTPS endpoint"
              if ! curl -fsS "https://\$APP_DOMAIN/health" > /dev/null;then
                echo "HTTPS smoke test failed"
                return 1
              fi
              echo "Check Prometheus Config"
              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml exec -T prometheus promtool check config /etc/prometheus/prometheus.yml;then
                echo "Prometheus config check failed"
                return 1
              fi
              echo "Reloading Prometheus"
              if ! curl -f -X POST http://127.0.0.1:9090/-/reload; then
                echo "Prometheus reload failed"
                return 1
              fi
              echo "Check Prometheus targets"
              if ! python3 scripts/check_monitoring.py; then
                echo "Prometheus scrape failed"
                return 1
              fi
              echo "Check Grafana health"
              GRAFANA_SUCCESS=false

              for i in {1..6}; do
                if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
                  GRAFANA_SUCCESS=true
                  break
                fi

                echo "Grafana not ready, retrying..."
                sleep 5
              done

              if [ "\$GRAFANA_SUCCESS" != "true" ]; then
                echo "Grafana health check failed"
                return 1
              fi
              echo "Production check passed"
              return 0
            }


            
            
            cd ~/backend-portfolio || exit 1

            echo "\$GHCR_READ_TOKEN" | sudo docker login ghcr.io -u "\$GHCR_USERNAME" --password-stdin || exit 1
            
            DISK_USAGE=\$(df -P / | awk 'NR==2 {print \$5}' | tr -d '%')

            if [ "\$DISK_USAGE" -ge 90 ]; then
              echo "Disk usage is high, cleaning build cache"
              sudo docker builder prune -af || true

              DISK_USAGE=\$(df -P / | awk 'NR==2 {print \$5}' | tr -d '%')
              echo "Disk usage after cleanup: \${DISK_USAGE}%"
            fi

            if [ "\$DISK_USAGE" -ge 97 ]; then
              echo "Disk usage is critically high: \${DISK_USAGE}%"
              exit 1
            fi
            
            API_IMAGE="ghcr.io/qazwsd741856-hue/backend-portfolio-api:\$DEPLOY_SHA"
            sudo docker pull "\$API_IMAGE" || exit 1
            
            if sudo docker inspect backend-api --format "{{.Config.Image}}" > /dev/null 2>&1; then
              CURRENT_IMAGE=\$(sudo docker inspect backend-api --format "{{.Config.Image}}")
              CURRENT_TAG="\${CURRENT_IMAGE##*:}"
              CAN_ROLLBACK=true

              echo "CURRENT_IMAGE:\${CURRENT_IMAGE}"
            else
              CAN_ROLLBACK=false

              echo "No existing API container, rollback will not be available"
            fi

            git fetch origin || exit 1
            git reset --hard "\$DEPLOY_SHA" || exit 1
            
            PREPARE_SUCCESS=true
    
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml up -d --wait db redis; then
                echo "DB or Redis running failed"
                PREPARE_SUCCESS=false
              fi
            fi
            
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml run --rm api alembic upgrade head; then
                echo "DB alembic upgrade failed"
                PREPARE_SUCCESS=false
              fi
            fi  
            
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml up -d --no-deps api;then
                echo "API start failed"
                PREPARE_SUCCESS=false
              fi
            fi
            
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              echo "Waiting for API health"

              API_SUCCESS=false

              for i in {1..24}; do
                status=\$(sudo docker inspect --format="{{.State.Health.Status}}" backend-api 2>/dev/null || echo "not-ready")

                echo "API health status: \$status"

                if [ "\$status" = "healthy" ]; then
                  API_SUCCESS=true
                  break
                fi

                sleep 5
              done

              if [ "\$API_SUCCESS" != "true" ]; then
                echo "API failed to become healthy"
                PREPARE_SUCCESS=false
              fi
            fi
            
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              echo "Starting Worker"

              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose \
                -f compose.yaml -f compose.prod.yaml \
                up -d --no-deps worker; then

                echo "Worker start failed"
                PREPARE_SUCCESS=false
              fi
            fi

            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              sleep 5
            fi

            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              echo "Starting Publisher"

              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose \
                -f compose.yaml -f compose.prod.yaml \
                up -d --no-deps publisher; then

                echo "Publisher start failed"
                PREPARE_SUCCESS=false
              fi
            fi
            
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              echo "Starting Nginx"

              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose \
                -f compose.yaml -f compose.prod.yaml \
                up -d --no-deps web; then

                echo "Nginx start failed"
                PREPARE_SUCCESS=false
              fi
            fi
            
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              echo "Starting Node Exporter"

              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose \
                -f compose.yaml -f compose.prod.yaml \
                up -d --no-deps node-exporter; then

                echo "Node Exporter start failed"
                PREPARE_SUCCESS=false
              fi
            fi

            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              echo "Starting cAdvisor"

              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose \
                -f compose.yaml -f compose.prod.yaml \
                up -d --no-deps cadvisor; then

                echo "cAdvisor start failed"
                PREPARE_SUCCESS=false
              fi
            fi
            
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              sleep 5
            fi
            
            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              echo "Starting Prometheus"

              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose \
                -f compose.yaml -f compose.prod.yaml \
                up -d --no-deps prometheus; then

                echo "Prometheus start failed"
                PREPARE_SUCCESS=false
              fi
            fi

            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              sleep 5
            fi

            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              echo "Starting Grafana"

              if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose \
                -f compose.yaml -f compose.prod.yaml \
                up -d --no-deps grafana; then

                echo "Grafana start failed"
                PREPARE_SUCCESS=false
              fi
            fi


            if [ "\$PREPARE_SUCCESS" = "true" ]; then
              if check_production; then
                echo "Deployment successful"
                DEPLOY_IMAGE="ghcr.io/qazwsd741856-hue/backend-portfolio-api:\$DEPLOY_SHA"

                for image in \$(sudo docker image ls "ghcr.io/qazwsd741856-hue/backend-portfolio-api:*" --format "{{.Repository}}:{{.Tag}}"); do
                  if [ "\$image" = "\$DEPLOY_IMAGE" ] || [ "\$image" = "\$CURRENT_IMAGE" ]; then
                    echo "keep:\$image"
                  else
                    sudo docker image rm "\$image"
                    echo "delete:\$image"
                  fi
                done
                exit 0
              fi
            fi
            
            echo "Deployment failed, starting rollback"
            if [ "\$CAN_ROLLBACK" = "false" ]; then
              echo "Cannot rollback,no useful image"
              exit 1
            else 
              echo "Rollback processing"
              git reset --hard "\$CURRENT_TAG" || exit 1
            fi
            
            IMAGE_TAG="\$CURRENT_TAG"
            if ! sudo IMAGE_TAG="\$IMAGE_TAG" docker compose -f compose.yaml -f compose.prod.yaml up -d; then
              echo "Rollback compose up failed"
              exit 1
            fi

            if check_production; then
              echo "Rollback successful"
              FAILED_IMAGE="ghcr.io/qazwsd741856-hue/backend-portfolio-api:\$DEPLOY_SHA"
              if sudo docker image rm "\$FAILED_IMAGE"; then
                echo "Deleted failed deployment image: \$FAILED_IMAGE"
              else
                echo "Could not delete failed deployment image: \$FAILED_IMAGE"
              fi
            else
              echo "Rollback failed"
            fi
            exit 1
            "



