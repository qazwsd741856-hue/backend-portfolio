services:
  api:
    build: .
    image: backend-portfolio-api:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: backend-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging: 
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "256m"
  web:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/certbot/www
    depends_on:
      api:
        condition: service_healthy
    logging: 
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "64m"
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD","pg_isready","-U","${POSTGRES_USER}","-d","${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: 
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "256m"
    restart: unless-stopped
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes    
    logging: 
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"  
    mem_limit: "128m"
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data: